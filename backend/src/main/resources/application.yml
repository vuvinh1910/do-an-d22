server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: platform-backend

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openapi_testing_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # QUAN TRỌNG: Dùng 'validate' để Hibernate chỉ đối soát Entity với DB do Flyway tạo,
      # tuyệt đối không để 'update' làm hỏng cấu trúc bảng!
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # RabbitMQ Broker Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rabbitmq}
    password: ${SPRING_RABBITMQ_PASSWORD:rabbitmqpassword}

# Cấu hình Queue & Exchange
app:
  rabbitmq:
    exchange: test.exchange
    queue:
      execution: test.execution.queue
      result: test.result.queue
    routing-key:
      execution: test.execution.key
      result: test.result.key
